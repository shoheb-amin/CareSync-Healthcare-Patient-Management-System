spring.application.name=notification-service
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

server.port=4008
patient.service.address=patient-service
patient.service.grpc.port=9002
appointment.service.address=appointment-service
appointment.service.grpc.port=9003

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true

spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=appointment-reminder-

logging.level.root=info

