spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

server.port=4006
grpc.server.port=9003

# Patient Service gRPC Client
grpc.client.patient-service.address=static://patient-service:9002
grpc.client.patient-service.negotiation-type=plaintext

grpc.client.doctor-service.address=static://doctor-service:9004
grpc.client.doctor-service.negotiation-type=plaintext
logging.level.root=info




