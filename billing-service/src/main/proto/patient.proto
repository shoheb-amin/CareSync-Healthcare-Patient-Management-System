syntax = "proto3";

option java_multiple_files = true;
option java_package = "patient";

service PatientService {

  rpc GetPatient(PatientRequest)
      returns (PatientResponse);
}

message PatientRequest {
  string patientId = 1;
}

message PatientResponse {
  string patientId = 1;
  string name = 2;
  string email = 3;
}